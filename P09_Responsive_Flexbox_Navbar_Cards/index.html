<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P9 - Responsive Flexbox Navbar & Cards</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="flex-navbar">
    <div class="brand">SulakshDev</div>
    <nav class="nav-items">
      <a href="#">Home</a>
      <a href="#">Skills</a>
      <a href="#">Projects</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <section class="flex-grid">
    <div class="flex-card">
      <h3>Card 1: HTML5</h3>
      <p>Semantic tags and accessible page structure.</p>
    </div>
    <div class="flex-card">
      <h3>Card 2: CSS Flexbox</h3>
      <p>Flexible one-dimensional row and column alignment.</p>
    </div>
    <div class="flex-card">
      <h3>Card 3: Responsive</h3>
      <p>Adapts smoothly on smaller screen widths using flex-wrap.</p>
    </div>
  </section>
</body>
</html>
